<!DOCTYPE html>
<html lang="da">
    <head>
        <title>Login</title>

        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <!-- Icon på fanen -->
        <link rel="icon" type="image/png" href="image/favicon.png">

        <!-- CSS link -->
        <link rel="stylesheet" href="style.css">

        <!-- JavaScript links -->


        <!-- Font Awesome ikoner-->
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

        <!-- Google Fonts -->
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,200..1000;1,200..1000&family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">

    </head>
    <body class="login-body">
        <img src="image/logo.webp" alt="Benedikte Brechmann" class="login-logo">
        <h1 class="login-titel">Din købsguide</h1>

      <form class="login">
            <label class="login__label"> E-mail:</label>
            <input type="email" name="email" class="login__input" placeholder="Indtast e-mail">

            <label class="login__label"> Adgangskode:</label>
            <input type="password" name="password" class="login__input" placeholder="Indtast adgangskode">
            <a href="#" class="login__glemt-kode">Glemt kode?</a>

            <a href="#" onclick="login()" class="primary-button login__button">Log ind</a>
            <a type="button" href="#" class="secundary-button login__button">Opret konto</a>
        </form>
        <script src="login.js"></script>
    </body>
</html>
